name: Build, test, and pack

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.os }} / .NET 8 and 10
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    # Linux x64 also runs the independent office and full 64-by-200 stress gates.
    # Keep the same bounded work while allowing for slower hosted runners.
    timeout-minutes: ${{ matrix.os == 'ubuntu-24.04' && 30 || 20 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - name: Restore pinned dependencies
        run: dotnet restore wordnet.sln --locked-mode
      - name: Verify release version identities
        shell: pwsh
        run: ./eng/test-release-version.ps1
      - name: Install Linux OCR prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libtesseract5 libfontconfig1 fontconfig
          mkdir -p ~/.local/share/fonts/wordnet
          cp src/wordnet/Resources/Fonts/*.ttf ~/.local/share/fonts/wordnet/
          fc-cache -f
      - name: Provision pinned English OCR data and test library
        shell: pwsh
        run: ./eng/prepare-ocr-tests.ps1 -Architecture ('${{ runner.arch }}'.ToLowerInvariant())
      - name: Build all library and desktop test targets
        run: dotnet build wordnet.sln --configuration Release --no-restore
      - name: Run .NET 8 conversion and robustness tests
        run: dotnet test tests/wordnet.Conversion.Tests --configuration Release --framework net8.0 --no-build --no-restore --logger "trx;LogFileName=net8.trx" --results-directory artifacts/test-results
      - name: Run .NET 10 conversion and robustness tests
        env:
          WORDNET_ODT_EVIDENCE: ${{ github.workspace }}/artifacts/p1-odt
          WORDNET_P2_EVIDENCE: ${{ github.workspace }}/artifacts/p2-objects
          WORDNET_ROADMAP_EVIDENCE: ${{ github.workspace }}/artifacts/roadmap-99/new-features
          WORDNET_INTEROP_ARTIFACTS: ${{ github.workspace }}/artifacts/roadmap-138/accessible-box
        run: dotnet test tests/wordnet.Conversion.Tests --configuration Release --framework net10.0 --no-build --no-restore --logger "trx;LogFileName=net10.trx" --results-directory artifacts/test-results
      - name: Run .NET Framework conversion and robustness tests
        if: runner.os == 'Windows' && runner.arch == 'X64'
        run: dotnet test tests/wordnet.Conversion.Tests --configuration Release --framework net472 --no-build --no-restore --logger "trx;LogFileName=net472.trx" --results-directory artifacts/test-results
      - name: Verify Framework runner deadlines and stale-report rejection
        if: runner.os == 'Windows' && runner.arch == 'X64'
        shell: pwsh
        run: ./eng/test-framework-runner.ps1
      - name: Verify Android report decoding
        shell: pwsh
        run: ./eng/test-android-report.ps1
      - name: Verify renderer capture on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./eng/test-comparison-renderer.ps1
      - name: Verify renderer capture on PowerShell 7
        shell: pwsh
        run: ./eng/test-comparison-renderer.ps1
      - name: Check formatting
        if: matrix.os == 'ubuntu-24.04'
        run: dotnet format wordnet.sln --verify-no-changes --no-restore
      - name: Verify comparison controls and authored corpus (commercial tools optional)
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update && sudo apt-get install -y poppler-utils
          python3 -m venv artifacts/comparison-venv
          artifacts/comparison-venv/bin/pip install -r eng/comparison-requirements.txt
          python3 eng/prepare-comparison-poi.py
          artifacts/comparison-venv/bin/python eng/test-comparison.py
          artifacts/comparison-venv/bin/python eng/test-fidelity-baseline.py
          artifacts/comparison-venv/bin/python eng/run-comparison.py --poi-classpath artifacts/comparison-poi
      - name: Capture independent office references for the P0 corpus
        if: matrix.os == 'ubuntu-24.04'
        env:
          LIBREOFFICE_VERSION: 4:24.2.7-0ubuntu0.24.04.7
        run: |
          sudo apt-get install -y --no-install-recommends "libreoffice-writer=$LIBREOFFICE_VERSION" "libreoffice-core=$LIBREOFFICE_VERSION"
          python3 eng/capture-office-comparison.py --output artifacts/p0-office
      - name: Measure office fidelity defects without changing the converter
        if: matrix.os == 'ubuntu-24.04'
        continue-on-error: true # #46 records existing differences; its scope excludes converter fixes.
        run: artifacts/comparison-venv/bin/python eng/run-comparison.py --cohort p0-2026-10 --iterations 1 --references artifacts/p0-office/references.json --output artifacts/p0-comparison-office
      - name: Validate P1 ODT schemas and independent office exchange
        if: matrix.os == 'ubuntu-24.04'
        run: |
          artifacts/comparison-venv/bin/pip install -r eng/odt-requirements.txt
          artifacts/comparison-venv/bin/python eng/verify-odt.py artifacts/p1-odt
      - name: Retain P1 ODT exchange evidence
        if: always() && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p1-odt-validation
          path: |
            artifacts/p1-odt/*.odt
            artifacts/p1-odt/*.docx
            artifacts/p1-odt/office/*.docx
            artifacts/p1-odt/verification.json
          if-no-files-found: error
      - name: Qualify P2 chart/math editing, vectors and native accessibility
        if: matrix.os == 'ubuntu-24.04'
        env:
          LIBREOFFICE_VERSION: 4:24.2.7-0ubuntu0.24.04.7
        run: |
          sudo apt-get install -y --no-install-recommends "libreoffice-calc=$LIBREOFFICE_VERSION" "libreoffice-math=$LIBREOFFICE_VERSION"
          python3 -m venv artifacts/p2-venv
          artifacts/p2-venv/bin/pip install -r eng/p2-requirements.txt
          python3 eng/verify-p2-office.py artifacts/p2-objects
          artifacts/p2-venv/bin/python eng/verify-p2.py artifacts/p2-objects --office-edited
          artifacts/p2-venv/bin/python eng/verify-nary-font.py
          python3 eng/validate-pdf-accessibility.py artifacts/p2-objects --output artifacts/p2-objects/ua-verification.xml --files native-hindi.pdf native-arabic.pdf native-hindi-link.pdf native-hindi-negative.pdf native-arabic-negative.pdf
          dotnet run --project examples/WordNet.Automation -c Release --no-build --no-restore -- artifacts/p2-sample tests/wordnet.Conversion.Tests/Fixtures/P2/STIXTwoMath.ttf tests/wordnet.Conversion.Tests/Fixtures/P2/NotoSansDevanagari-Regular.ttf tests/wordnet.Conversion.Tests/Fixtures/Interoperability/NotoSansArabic-Regular.ttf
      - name: Qualify roadmap table stories and separate object PDF profiles
        if: matrix.os == 'ubuntu-24.04'
        run: |
          artifacts/p2-venv/bin/python eng/verify-roadmap-99.py artifacts/roadmap-99/new-features
          python3 eng/validate-pdf-accessibility.py artifacts/roadmap-99/new-features --output artifacts/roadmap-99/ua-verification.xml --files objects-ua.pdf native-hindi-table.pdf native-arabic-table.pdf native-hindi-table-footer.pdf native-arabic-table-footer.pdf objects-ua-negative.pdf
          python3 eng/validate-pdf-accessibility.py artifacts/roadmap-99/new-features --flavour 2b --output artifacts/roadmap-99/pdfa-verification.xml --files objects-pdfa.pdf objects-pdfa-negative.pdf
      - name: Independently qualify anchor-ordered accessible text boxes
        if: matrix.os == 'ubuntu-24.04'
        run: |
          python3 eng/validate-pdf-accessibility.py artifacts/roadmap-138/accessible-box --output artifacts/roadmap-138/accessible-box/verapdf.xml --files accessible-boxes.pdf accessible-boxes-multipage.pdf accessible-boxes-selection.pdf accessible-boxes-two.pdf accessible-boxes-negative.pdf
          artifacts/p2-venv/bin/python eng/check-roadmap-138-accessible-box.py artifacts/roadmap-138/accessible-box/accessible-boxes.pdf
          artifacts/p2-venv/bin/python eng/check-roadmap-138-accessible-box.py artifacts/roadmap-138/accessible-box/accessible-boxes-multipage.pdf --pages 2
          artifacts/p2-venv/bin/python eng/check-roadmap-138-accessible-box.py artifacts/roadmap-138/accessible-box/accessible-boxes-selection.pdf --selected
          artifacts/p2-venv/bin/python eng/check-roadmap-138-accessible-box.py artifacts/roadmap-138/accessible-box/accessible-boxes-two.pdf --two
          artifacts/p2-venv/bin/python eng/test-roadmap-138-accessible-box-checker.py artifacts/roadmap-138/accessible-box/accessible-boxes.pdf artifacts/roadmap-138/accessible-box/accessible-boxes-negative.pdf artifacts/roadmap-138/accessible-negative-controls
      - name: Retain accessible text-box qualification evidence
        if: always() && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roadmap-138-accessible-box
          path: |
            artifacts/roadmap-138/accessible-box/accessible-boxes*
            artifacts/roadmap-138/accessible-box/verapdf.*
            artifacts/roadmap-138/accessible-negative-controls/*.pdf
          if-no-files-found: error
      - name: Independently qualify accessible vector figures
        if: matrix.os == 'ubuntu-24.04'
        run: |
          files=(accessible-vector-described.pdf accessible-vector-decorative.pdf accessible-vector-selection.pdf accessible-vector-two.pdf accessible-vector-stroke.pdf accessible-vector-box.pdf accessible-vector-box-decorative.pdf accessible-vector-negative.pdf)
          for kind in line ellipse roundRect rect triangle diamond; do
            for policy in described decorative; do files+=("accessible-vector-${kind}-${policy}.pdf"); done
          done
          python3 eng/validate-pdf-accessibility.py artifacts/roadmap-138/accessible-box --output artifacts/roadmap-138/accessible-box/vector-verapdf.xml --files "${files[@]}"
          artifacts/p2-venv/bin/python eng/check-roadmap-138-accessible-vectors.py artifacts/roadmap-138/accessible-box/accessible-vector-described.pdf --mode described
          artifacts/p2-venv/bin/python eng/check-roadmap-138-accessible-vectors.py artifacts/roadmap-138/accessible-box/accessible-vector-decorative.pdf --mode decorative
          artifacts/p2-venv/bin/python eng/check-roadmap-138-accessible-vectors.py artifacts/roadmap-138/accessible-box/accessible-vector-selection.pdf --mode selection
          artifacts/p2-venv/bin/python eng/check-roadmap-138-accessible-vectors.py artifacts/roadmap-138/accessible-box/accessible-vector-two.pdf --mode two
          artifacts/p2-venv/bin/python eng/check-roadmap-138-accessible-vectors.py artifacts/roadmap-138/accessible-box/accessible-vector-stroke.pdf --mode stroke
          artifacts/p2-venv/bin/python eng/check-roadmap-138-accessible-vectors.py artifacts/roadmap-138/accessible-box/accessible-vector-box.pdf --mode box
          artifacts/p2-venv/bin/python eng/check-roadmap-138-accessible-vectors.py artifacts/roadmap-138/accessible-box/accessible-vector-box-decorative.pdf --mode box-decorative
          for kind in line ellipse roundRect rect triangle diamond; do
            for policy in described decorative; do
              artifacts/p2-venv/bin/python eng/check-roadmap-138-accessible-vectors.py "artifacts/roadmap-138/accessible-box/accessible-vector-${kind}-${policy}.pdf" --mode "$policy"
            done
          done
          artifacts/p2-venv/bin/python eng/test-roadmap-138-accessible-vectors-checker.py artifacts/roadmap-138/accessible-box/accessible-vector-described.pdf artifacts/roadmap-138/accessible-box/accessible-vector-negative.pdf artifacts/roadmap-138/vector-negative-controls
      - name: Retain accessible vector qualification evidence
        if: always() && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roadmap-138-accessible-vectors
          path: |
            artifacts/roadmap-138/accessible-box/accessible-vector-*.pdf
            artifacts/roadmap-138/accessible-box/vector-verapdf.*
            artifacts/roadmap-138/vector-negative-controls/*.pdf
          if-no-files-found: error
      - name: Independently qualify accessible archival PDF
        if: matrix.os == 'ubuntu-24.04'
        run: |
          source=artifacts/roadmap-138/accessible-box
          controls=artifacts/roadmap-138/accessible-archive-controls
          artifacts/p2-venv/bin/python eng/verify-roadmap-138-accessible-archive.py "$source" "$controls"
          artifacts/p2-venv/bin/python eng/check-roadmap-138-accessible-vectors.py "$source/accessible-archive-box.pdf" --mode box
          artifacts/p2-venv/bin/python eng/check-roadmap-138-accessible-vectors.py "$source/accessible-archive-box-decorative.pdf" --mode box-decorative
          cp "$source"/accessible-archive-*.pdf "$controls/"
          files=(accessible-archive-basic.pdf accessible-archive-objects.pdf accessible-archive-box.pdf accessible-archive-box-decorative.pdf accessible-archive-images.pdf accessible-archive-negative.pdf accessible-archive-metadata-negative.pdf)
          python3 eng/validate-pdf-accessibility.py "$controls" --flavour 2a --output "$controls/pdfa.xml" --files "${files[@]}"
          files+=(accessible-archive-language-negative.pdf)
          python3 eng/validate-pdf-accessibility.py "$controls" --flavour ua1 --output "$controls/ua.xml" --files "${files[@]}"
      - name: Retain accessible archival qualification evidence
        if: always() && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roadmap-138-accessible-archive
          path: |
            artifacts/roadmap-138/accessible-archive-controls/*.pdf
            artifacts/roadmap-138/accessible-archive-controls/*.xml
            artifacts/roadmap-138/accessible-archive-controls/*.stderr
          if-no-files-found: error
      - name: Retain roadmap independent qualification evidence
        if: always() && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roadmap-99-qualification
          path: artifacts/roadmap-99/**
          if-no-files-found: error
      - name: Retain P2 independent qualification evidence
        if: always() && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: p2-objects-typography
          path: |
            artifacts/p2-objects/**
            artifacts/p2-sample/**
          if-no-files-found: error
      - name: Require complete office measurements and retained defect verdicts
        if: matrix.os == 'ubuntu-24.04'
        run: |
          python3 - <<'PY'
          import json
          import runpy
          from pathlib import Path
          report = json.loads(Path('artifacts/p0-comparison-office/results.json').read_text())
          assert len(report['results']) == 12
          assert all(r['status'] == 'measured' and len(r['referenceChecks']) == 1 and r['referenceChecks'][0]['status'] == 'compared' for r in report['results'])
          defects = json.loads(Path('artifacts/p0-comparison-office/defects.json').read_text())
          runpy.run_path('eng/run-comparison.py')['validate_defect_report'](report, defects)
          PY
      - name: Upload authored comparison measurements and retained failures
        if: always() && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: business-comparison
          path: |
            artifacts/comparison/*.json
            artifacts/comparison/*.pdf
            artifacts/comparison/*.doc
            artifacts/comparison/*.png
            artifacts/p0-office/**
            artifacts/p0-comparison-office/**
          if-no-files-found: error
      - name: Independently validate the PDF/A-2b corpus
        if: matrix.os == 'ubuntu-24.04'
        shell: pwsh
        run: ./eng/validate-pdfa.ps1
      - name: Require the complete suite with no skips
        shell: pwsh
        run: |
          $required = [int](Get-Content eng/required-tests.txt -Raw)
          foreach ($report in Get-ChildItem artifacts/test-results/*.trx) {
            [xml]$trx = Get-Content -LiteralPath $report.FullName
            $counters = $trx.TestRun.ResultSummary.Counters
            if ([int]$counters.total -lt $required -or $counters.passed -ne $counters.total) {
              throw "Missing, failed or skipped tests in $($report.Name)"
            }
          }
      - name: Isolated malformed-input campaign
        if: runner.arch == 'X64'
        shell: pwsh
        run: |
          dotnet tools/wordnet.Qualification/bin/Release/net10.0/wordnet.Qualification.dll self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tools/wordnet.Qualification/bin/Release/net10.0/wordnet.Qualification.dll fuzz tests/wordnet.Conversion.Tests/Fixtures artifacts/qualification 128
          exit $LASTEXITCODE
      - name: Concurrent conversion and OCR resource qualification
        if: runner.arch == 'X64'
        shell: pwsh
        run: |
          dotnet tools/wordnet.Qualification/bin/Release/net10.0/wordnet.Qualification.dll benchmark tests/wordnet.Conversion.Tests/Fixtures artifacts/qualification 32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet tools/wordnet.Qualification/bin/Release/net10.0/wordnet.Qualification.dll ocr tests/wordnet.Conversion.Tests/Fixtures artifacts/qualification 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Enterprise fixed-clock 64 by 200 concurrency gate
        if: matrix.os == 'ubuntu-24.04'
        shell: pwsh
        env:
          DOTNET_GCHeapHardLimit: '100000000'
        run: |
          dotnet tools/wordnet.ManagedExport.Probe/bin/Release/net10.0/wordnet.ManagedExport.Probe.dll tests/wordnet.Conversion.Tests/Fixtures/Enterprise 200 | Tee-Object artifacts/qualification/enterprise-concurrency.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Pack and validate framework API compatibility
        if: matrix.os == 'ubuntu-24.04'
        run: |
          dotnet pack src/wordnet.Fonts/wordnet.Fonts.csproj --configuration Release --no-build --no-restore --output artifacts/packages
          dotnet pack src/wordnet/wordnet.csproj --configuration Release --no-build --no-restore --output artifacts/packages
          dotnet pack src/wordnet.Ocr/wordnet.Ocr.csproj --configuration Release --no-build --no-restore --output artifacts/packages
      - name: Prepare portable minimum-runtime source qualification
        if: runner.os == 'Windows' && runner.arch == 'X64'
        shell: pwsh
        run: ./eng/minimum-runtimes/prepare-windows-vm.ps1 -OutputDirectory artifacts/framework-source-vm -TestDirectory tests/wordnet.Conversion.Tests/bin/Release/net472/win-x64 -TestAsset source
      - name: Upload minimum-runtime source VM setup
        if: runner.os == 'Windows' && runner.arch == 'X64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: framework-source-vm
          path: artifacts/framework-source-vm/
          compression-level: 0
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tests-${{ matrix.os }}
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
      - name: Upload validated packages
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-packages
          path: artifacts/packages/*.*nupkg
          if-no-files-found: error
      - name: Upload qualification measurements
        if: always() && runner.arch == 'X64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-${{ matrix.os }}
          path: |
            artifacts/qualification/*.json
            artifacts/qualification/enterprise-concurrency.txt
          if-no-files-found: error
      - name: Upload independent PDF/A evidence
        if: always() && matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdfa-validation
          path: artifacts/pdfa-validation/verapdf.*
          if-no-files-found: error

  performance:
    name: Single-core PDF performance and memory
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Install baseline graphics prerequisites
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1
      - name: Verify comparison guards
        shell: pwsh
        run: ./eng/test-performance-gate.ps1
      - name: Compare both revisions on this runner
        shell: pwsh
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          $reference = if ($env:PR_BASE) { $env:PR_BASE } elseif ($env:PUSH_BASE -and $env:PUSH_BASE -notmatch '^0+$') { $env:PUSH_BASE } else { 'origin/main' }
          ./eng/run-performance-gate.ps1 -ReferenceRevision $reference
      - name: Upload comparable measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-gate
          path: |
            artifacts/performance-gate/comparison.json
            artifacts/performance-gate/measurements/*.json
          if-no-files-found: error

  package:
    needs: desktop
    name: Packed assets / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      NUGET_PACKAGES: ${{ github.workspace }}/artifacts/package-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-packages
          path: artifacts/packages
      - name: Install Linux OCR prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libtesseract5 libfontconfig1 fontconfig
          mkdir -p ~/.local/share/fonts/wordnet
          cp src/wordnet/Resources/Fonts/*.ttf ~/.local/share/fonts/wordnet/
          fc-cache -f
      - name: Exercise the exact NuGet and explicit .NET Standard fallback
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/wordnet/wordnet.csproj
          $framework = '${{ runner.os }}' -eq 'Windows' -and '${{ runner.arch }}' -eq 'X64'
          ./eng/test-package.ps1 -Version $project.Project.PropertyGroup.Version -Commit $env:GITHUB_SHA -IncludeFramework:$framework
      - name: Prepare portable minimum-runtime package qualification
        if: runner.os == 'Windows' && runner.arch == 'X64'
        shell: pwsh
        run: |
          [xml]$project = Get-Content src/wordnet/wordnet.csproj
          ./eng/minimum-runtimes/prepare-windows-vm.ps1 -OutputDirectory artifacts/framework-package-vm -TestDirectory tests/wordnet.Conversion.Tests/bin/Release/net472/win-x64 -TestAsset package -PackageVersion $project.Project.PropertyGroup.Version
      - name: Upload minimum-runtime package VM setup
        if: runner.os == 'Windows' && runner.arch == 'X64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: framework-package-vm
          path: artifacts/framework-package-vm/
          compression-level: 0
          if-no-files-found: error
      - name: Upload package execution evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packaged-tests-${{ matrix.os }}
          path: artifacts/package-tests/*.trx
          if-no-files-found: error

  minimum-framework-source:
    needs: desktop
    uses: ./.github/workflows/framework472.yml
    with:
      asset: source

